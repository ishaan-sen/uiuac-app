[package]
name = "uiuac-app"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version="1.0.229", features=["derive"]}
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "tls-rustls"] }
tokio = { version="1.54.1", features=["full"]}

uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
